name: BSCampus CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Nilai dummy khusus CI. Runner tidak membuka koneksi ke layanan ini,
          # dipakai hanya supaya `next build` tidak gagal saat env kosong.
          JWT_SECRET: ci-dummy-jwt-secret-not-used-at-runtime
          ADMIN_USERNAME: ci-dummy-admin
          ADMIN_PASSWORD: ci-dummy-password
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key

      - name: Type check
        run: npx tsc --noEmit

      - name: Cek secrets Vercel
        id: vercel-secrets
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Deploy dilewati. Secrets belum diset:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main' && steps.vercel-secrets.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          # Nilai dummy khusus CI. Runner tidak membuka koneksi ke layanan ini,
          # dipakai hanya supaya `next build`/tsc tidak gagal saat env kosong.
          JWT_SECRET: ci-dummy-jwt-secret-not-used-at-runtime
          ADMIN_USERNAME: ci-dummy-admin
          ADMIN_PASSWORD: ci-dummy-password
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key