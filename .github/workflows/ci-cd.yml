name: BSCampus CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          echo "NODE_ENV=$NODE_ENV"
          echo "node: $(node -v) | npm: $(npm -v)"
          echo "--- isi node_modules/.bin (jest*) ---"
          ls node_modules/.bin | grep -i jest || echo "TIDAK ADA jest di .bin"
          echo "--- jalankan jest langsung ---"
          npx jest 2>&1 | tail -40
          echo "jest-exit=${PIPESTATUS[0]}"
          echo "--- jalankan npm test ---"
          npm test

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          # Secret dummy khusus CI. Hanya dipakai `next build` (tidak ada
          # koneksi runtime), supaya build tidak gagal saat JWT_SECRET kosong.
          JWT_SECRET: ci-dummy-jwt-secret-not-used-at-runtime
          ADMIN_USERNAME: ci-dummy-admin
          ADMIN_PASSWORD: ci-dummy-password
